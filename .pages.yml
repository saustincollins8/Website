# Pages CMS configuration: the editing screens Austin sees at app.pagescms.org.
# Field names must match the schemas in src/content.config.ts.

media:
  - name: images
    label: Images
    input: src/assets
    # Written relative to src/content/profile.yml, which is where Astro resolves it.
    output: ../assets
    categories: [image]
    rename: safe
  # Images inserted into rich-text fields. Those Markdown files sit one folder
  # deeper (src/content/<collection>/), so the relative path needs one more "../".
  - name: content-images
    label: Images in text
    input: src/assets
    output: ../../assets
    categories: [image]
    rename: safe
  - name: files
    label: PDFs
    input: public/files
    output: /files
    categories: [document]
    rename: safe

content:
  - name: profile
    label: Profile
    description: Name, bio, contact details, current positions, links and the footer quote.
    type: file
    path: src/content/profile.yml
    format: yaml
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: fullName
        label: Full name
        description: Used only for search engines, e.g. "S. Austin Collins".
        type: string
      - name: tagline
        label: Tagline
        description: Shown under your name at the top of every page.
        type: string
        required: true
      - name: shortBio
        label: Short bio
        description: One or two sentences shown in search results and link previews.
        type: text
        required: true
      - name: email
        label: Email
        type: string
      - name: headshot
        label: Headshot
        type: image
        options:
          media: images
      - name: headshotAlt
        label: Headshot description
        description: A short description of the photo for screen readers.
        type: string
      - name: currentPositions
        label: Current positions
        description: Shown on the home page and the Contact page.
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: institution
            label: Institution
            type: string
            required: true
          - name: url
            label: Profile link
            type: string
      - name: researchInterests
        label: Research interests
        type: string
        list: true
      - name: links
        label: Links
        description: Listed under "Elsewhere online" on the Contact page.
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true
      - name: footerQuote
        label: Footer quote
        type: object
        fields:
          - name: text
            label: Quote
            type: text
          - name: translation
            label: Translation
            type: string
          - name: author
            label: Author
            type: string
          - name: lang
            label: Language code
            description: For example "fr" for French. Leave empty for English.
            type: string
      - name: credit
        label: Site credit
        description: The small "Site by …" line in the footer. Clear the text to hide it.
        type: object
        fields:
          - name: text
            label: Text
            type: string
          - name: url
            label: Link
            type: string

  - name: page-text
    label: Page text
    type: group
    items:
      - name: home
        label: Home page bio
        type: file
        path: src/content/pages/home.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: body
            label: Bio
            type: rich-text
            options:
              media: content-images
      - name: research
        label: Research page
        type: file
        path: src/content/pages/research.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Description
            description: Shown in search results and link previews.
            type: text
          - name: body
            label: Page text
            type: rich-text
            options:
              media: content-images
      - name: teaching
        label: Teaching page
        type: file
        path: src/content/pages/teaching.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Description
            description: Shown in search results and link previews.
            type: text
          - name: intro
            label: Introduction
            type: text
          - name: body
            label: Teaching statement
            description: Leave empty to hide the teaching statement section.
            type: rich-text
            options:
              media: content-images

  - name: cv
    label: CV
    description: The CV PDF and everything on the CV page except publications, talks and courses.
    type: file
    path: src/content/cv.yml
    format: yaml
    fields:
      - name: pdf
        label: CV (PDF)
        description: Remove your home address and referees' contact details before uploading.
        type: file
        options:
          media: files
          extensions: [pdf]
      - name: positions
        label: Positions
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: string
            required: true
          - name: institution
            label: Institution
            type: string
            required: true
          - name: dates
            label: Dates
            description: For example "Aug 2026 – present".
            type: string
            required: true
          - name: note
            label: Note
            type: text
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: degree
            label: Degree
            type: string
            required: true
          - name: institution
            label: Institution
            type: string
            required: true
          - name: dates
            label: Dates
            type: string
            required: true
          - name: note
            label: Note
            description: Supervisors, thesis title and so on.
            type: text
      - name: grants
        label: Funding and research grants
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: funder
            label: Funder
            type: string
          - name: dates
            label: Dates
            type: string
            required: true
          - name: note
            label: Note
            type: text
      - name: honours
        label: Honours and awards
        type: string
        list: true
      - name: memberships
        label: Professional memberships
        type: string
        list: true
      - name: languages
        label: Languages
        type: string
        list: true

  - name: publications
    label: Publications
    description: Citations are formatted automatically in Chicago style.
    type: collection
    path: src/content/publications
    view:
      fields: [title, type, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        description: For a book review, the title of the book being reviewed.
        type: string
        required: true
      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
            - value: book
              label: Book
            - value: article
              label: Article
            - value: chapter
              label: Book chapter
            - value: review
              label: Book review
            - value: report
              label: Workshop report
      - name: status
        label: Status
        type: select
        default: published
        options:
          values:
            - value: published
              label: Published
            - value: forthcoming
              label: Forthcoming
            - value: in-progress
              label: In progress
      - name: date
        label: Date
        description: Only the year is shown on the site.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: venue
        label: Journal, book or website
        type: string
      - name: volume
        label: Volume
        type: string
      - name: issue
        label: Issue
        type: string
      - name: pages
        label: Pages
        type: string
      - name: publisher
        label: Publisher
        type: string
      - name: editors
        label: Editors
        description: Book chapters only.
        type: string
      - name: reviewedWork
        label: Book reviewed
        description: Book reviews only.
        type: object
        fields:
          - name: creators
            label: Authors or editors
            description: For example "edited by Kelly Digby Peebles and Gabriella Scarlatta".
            type: string
          - name: publisher
            label: Publisher
            type: string
          - name: year
            label: Year
            type: string
      - name: doi
        label: DOI
        description: For example "10.1515/urbrel.22664478", without https://doi.org/.
        type: string
      - name: url
        label: Link
        description: Only needed if there is no DOI.
        type: string
      - name: note
        label: Note
        description: Shown after the citation, e.g. "Manuscript in revision".
        type: string
      - name: featured
        label: Show on the home page
        type: boolean
        default: false

  - name: talks
    label: Talks & Media
    type: collection
    path: src/content/talks
    view:
      fields: [title, event, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: kind
        label: Kind
        type: select
        required: true
        options:
          values:
            - value: conference
              label: Conference paper
            - value: invited
              label: Invited talk or colloquium
            - value: workshop
              label: Workshop paper
            - value: podcast
              label: Podcast
            - value: video
              label: Video
            - value: writing
              label: Blog post or public writing
      - name: event
        label: Event or outlet
        type: string
        required: true
      - name: location
        label: Location
        description: For example "Groningen, Netherlands".
        type: string
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: datePrecision
        label: Show the date as
        type: select
        default: month
        options:
          values:
            - value: month
              label: Month and year
            - value: year
              label: Year only
            - value: day
              label: Full date
      - name: note
        label: Note
        type: string
      - name: url
        label: Link
        description: To the event, the recording or the text.
        type: string
      - name: video
        label: Video link
        type: string

  - name: courses
    label: Teaching
    description: Courses shown on the Teaching page and the CV.
    type: collection
    path: src/content/courses
    view:
      fields: [title, institution, start]
      primary: title
      sort: [start, title]
      default:
        sort: start
        order: desc
    fields:
      - name: title
        label: Course title
        type: string
        required: true
      - name: institution
        label: Institution
        type: string
        required: true
      - name: when
        label: When
        description: Shown on the site, e.g. "Fall 2026" or "2024–25".
        type: string
      - name: start
        label: Start date
        description: Not shown on the site; only used to order courses, newest first.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: format
        label: Level or format
        description: For example "Upper-level" or "Online, asynchronous".
        type: string
      - name: syllabus
        label: Syllabus (PDF)
        type: file
        options:
          media: files
          extensions: [pdf]
      - name: body
        label: Description
        type: rich-text
        options:
          media: content-images
